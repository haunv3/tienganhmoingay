<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f9f5"><title>Bạn đang ngoại tuyến — Tiếng Anh Mỗi Ngày</title><style>:root{color-scheme:light;--bg:#f8f9f5;--card:#fffefb;--ink:#243c32;--muted:#66736b}html[data-theme=dark]{color-scheme:dark;--bg:#15231d;--card:#203329;--ink:#edf3e9;--muted:#bcc9bf}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{max-width:440px;padding:32px;margin:20px;background:var(--card);border-radius:24px}h1{font-size:28px;line-height:1.3}p{color:var(--muted)}a{display:inline-block;background:#326b4c;color:white;padding:12px 20px;border-radius:12px;text-decoration:none}:focus-visible{outline:3px solid #b78439;outline-offset:4px}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tam_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script></head><body><main><span aria-hidden="true">✳</span><h1>Một chút nghỉ giữa giờ.</h1><p>Bạn đang mất kết nối. Những trang đã mở trực tiếp và được lưu có thể xem lại khi ngoại tuyến. Kết nối mạng để mở bài mới nhé.</p><a href="/hoc-ngay">Thử mở bài hôm nay →</a><p>Tiến độ học vẫn được giữ trên thiết bị của bạn.</p></main></body></html>
